name: API Authentication Checks

on:
  push:
    branches:
      - main
      - feature/production-authentication
  pull_request:
    branches:
      - main
      - feature/production-authentication

permissions:
  contents: read

jobs:
  api-auth:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fortress_fund_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fortress_fund_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortress_fund_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fortress-fund/api prisma:generate

      - name: Apply Prisma migrations
        run: pnpm --filter @fortress-fund/api prisma:migrate:deploy

      - name: Build API
        run: pnpm --filter @fortress-fund/api build

      - name: Run authentication and ledger integration tests
        run: pnpm --filter @fortress-fund/api test

      - name: Run financial product unit tests
        run: pnpm --filter @fortress-fund/api test:vitest -- test/financial-product.defaults.spec.ts test/financial-product.service.spec.ts
