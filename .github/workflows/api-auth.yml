name: API Authentication Checks

on:
  push:
    branches:
      - feature/production-authentication
  pull_request:
    branches:
      - main
      - feature/production-authentication

permissions:
  contents: write

jobs:
  api-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and synchronize lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit synchronized lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(api): synchronize pnpm lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Generate Prisma client
        run: pnpm --filter @fortress-fund/api prisma:generate

      - name: Build API
        run: pnpm --filter @fortress-fund/api build

      - name: Run authentication tests
        run: pnpm --filter @fortress-fund/api test
