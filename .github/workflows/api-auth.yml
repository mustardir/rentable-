name: API Authentication Checks

on:
  push:
    branches:
      - main
      - feature/production-authentication
  pull_request:
    branches:
      - main
      - feature/production-authentication
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-auth:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fortress_fund_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fortress_fund_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortress_fund_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Nest platform runtime resolution
        run: |
          pnpm --filter @fortress-fund/api exec node -p "require.resolve('@nestjs/platform-express')"
          pnpm --filter @fortress-fund/api exec node -p "require('@nestjs/platform-express/package.json').version"

      - name: Generate Prisma client
        run: pnpm --filter @fortress-fund/api prisma:generate

      - name: Apply Prisma migrations
        run: pnpm --filter @fortress-fund/api prisma:migrate:deploy

      - name: Build API
        run: pnpm --filter @fortress-fund/api build

      - name: Run authentication and ledger integration tests
        run: pnpm --filter @fortress-fund/api test
        env:
          JEST_TEST_PATH_IGNORE: >-
            --testPathIgnorePatterns=financial-product\.defaults\.spec\.ts
            --testPathIgnorePatterns=financial-product\.service\.spec\.ts
            --testPathIgnorePatterns=document-core\.docx\.spec\.ts
            --testPathIgnorePatterns=document-template\.pipeline\.spec\.ts

      - name: Run transfer concurrency integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/transfers-concurrency.integration.spec.ts

      - name: Run wallet concurrency integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/wallet-concurrency.integration.spec.ts

      - name: Run wallet idempotency concurrency integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/wallet-idempotency-concurrency.integration.spec.ts

      - name: Run wallet operator approval/rejection race integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/wallet-approval-rejection-concurrency.integration.spec.ts

      - name: Run wallet audit atomicity integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/wallet-audit-atomicity.integration.spec.ts

      - name: Run ledger account mapping provisioning integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/ledger-account-mapping.integration.spec.ts

      - name: Run authenticated ledger mapping HTTP integration test
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/ledger-account-mapping.http.integration.spec.ts

      - name: Run ledger mapping controller authorization tests
        run: pnpm --filter @fortress-fund/api exec jest --runInBand --roots src --runTestsByPath src/ledger/ledger.controller.spec.ts

      - name: Run investment subscription Jest tests
        run: pnpm --filter @fortress-fund/api test -- --runInBand test/investment-subscription.service.spec.ts

      - name: Run financial product and DOCX unit tests
        run: pnpm --filter @fortress-fund/api test:vitest test/financial-product.defaults.spec.ts test/financial-product.service.spec.ts test/financial-product.controller.spec.ts test/document-core.docx.spec.ts test/document-template.pipeline.spec.ts

      - name: Run ledger immutability checkpoint tests
        run: pnpm --filter @fortress-fund/api test -- --runInBand ledger-immutability.integration.spec.ts

      - name: Report checkpoint results
        if: always()
        run: |
          echo "## 🔐 Ledger Immutability Checkpoint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Migration:** Fortress Guard PostgreSQL triggers" >> $GITHUB_STEP_SUMMARY
          echo "**Test File:** \`apps/api/test/ledger-immutability.integration.spec.ts\`" >> $GITHUB_STEP_SUMMARY
          echo "**Test Cases:** 12" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Checkpoint requirements verified:**" >> $GITHUB_STEP_SUMMARY
          echo "- Posted journal entries are immutable" >> $GITHUB_STEP_SUMMARY
          echo "- Journal entries cannot be deleted" >> $GITHUB_STEP_SUMMARY
          echo "- Journal lines cannot be edited or deleted" >> $GITHUB_STEP_SUMMARY
          echo "- Reversals follow 1:1 linking protocol" >> $GITHUB_STEP_SUMMARY
          echo "- Transactions rollback on constraint violation" >> $GITHUB_STEP_SUMMARY
