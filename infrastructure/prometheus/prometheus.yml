global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    domain: fortress-fund.com

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

# API, nginx, PostgreSQL, and Redis metrics will be added when their
# corresponding exporters/instrumentation are enabled.
